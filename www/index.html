<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Fronts du Temps</title>
<style>
  :root{--glass:rgba(14,10,10,.9);--line:rgba(190,60,50,.22);--txt:#f1f5f9;--mut:#a3adbd;--gold:#fcd34d;--xp:#7dd3fc;--ok:#22c55e;--hot:#f97316;--b:clamp(46px,15vh,62px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0e14;color:var(--txt);font:600 13px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  canvas#c{display:block;width:100%;height:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  .glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.35)}
  /* barre du haut */
  #top{position:absolute;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;align-items:center;gap:6px;pointer-events:none}
  #top>*{pointer-events:auto}
  .pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;white-space:nowrap}
  .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2,#fbbf24 45%,#b45309);box-shadow:0 0 6px #fbbf2466}
  .star{color:var(--xp);font-size:14px}
  #era{font-weight:800;letter-spacing:.03em;font-family:Georgia,serif}
  #era small{color:var(--mut);font-weight:700;margin-right:4px}
  #gold{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
  #xpWrap{flex-direction:column;align-items:stretch;justify-content:center;gap:2px;height:32px;min-width:96px}
  #xpTxt{font-size:11px;color:var(--xp);display:flex;gap:4px;align-items:center}
  #xpBar{height:5px;border-radius:3px;background:#0008;overflow:hidden}
  #xpBar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a5f3fc);transition:width .2s}
  .sp{flex:1}
  .ibtn{height:32px;min-width:32px;padding:0 10px;border-radius:999px;display:grid;place-items:center}
  .ibtn:active{transform:scale(.93)}
  #evolve{display:none;background:linear-gradient(#22c55e,#15803d);border-color:#86efac;animation:pulse 1.2s infinite;font-weight:800}
  #evolve.show{display:grid}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #22c55e88}50%{box-shadow:0 0 0 8px #22c55e00}}
  #special{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;position:relative;margin-top:14px;align-self:flex-start;background:conic-gradient(var(--hot) var(--p,100%),#ffffff1a 0);border:none}
  #special::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4b2a17,#1a1009)}
  #special span{position:relative;font-size:20px}
  #special.ready::before{background:radial-gradient(circle at 40% 35%,#f97316,#9a3412)}
  #special.ready{animation:pulse2 1s infinite}
  @keyframes pulse2{0%,100%{box-shadow:0 0 0 0 #f9731688}50%{box-shadow:0 0 0 9px #f9731600}}
  /* mini-carte */
  #mini{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(6px,env(safe-area-inset-top)) + 42px);width:min(380px,40vw);height:30px;border-radius:8px;cursor:pointer}
  /* dock du bas */
  #bot{position:absolute;bottom:max(6px,env(safe-area-inset-bottom));left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-end;gap:6px;pointer-events:none}
  .dock{display:flex;gap:4px;padding:4px;border-radius:14px;pointer-events:auto;position:relative}
  .btn{width:calc(var(--b)*1.06);height:var(--b);border-radius:10px;border:1px solid #ffffff22;background:linear-gradient(180deg,#2e2522,#1a1312 60%,#0e0a09);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;padding:0 0 2px;overflow:hidden;transition:transform .08s,filter .15s}
  .btn canvas{position:absolute;inset:0 0 13px 0;width:100%;height:calc(100% - 13px)}
  .btn .cost{position:relative;font-size:10.5px;color:var(--gold);font-weight:800;text-shadow:0 1px 2px #000}
  .btn .tag{position:absolute;top:2px;right:4px;font-size:9px;color:#e2e8f0;text-shadow:0 1px 2px #000}
  .btn .key{position:absolute;top:2px;left:4px;font-size:9px;color:#94a3b8}
  .btn:disabled{filter:grayscale(.85) brightness(.55)}
  .btn:not(:disabled):active{transform:scale(.92)}
  .btn.on{border-color:var(--hot);box-shadow:inset 0 0 0 2px var(--hot)}
  .btn.txt{font-size:10px;justify-content:center;gap:2px;width:calc(var(--b)*.9)}
  .btn.txt b{font-size:18px;line-height:1}
  #queue{position:absolute;left:6px;bottom:calc(100% + 4px);display:flex;gap:3px;align-items:flex-end}
  .qi.q0{width:auto;min-width:56px;padding:0 6px;gap:4px;display:flex;font-size:11px}
  .qi.q0 b{color:#fde68a;font-variant-numeric:tabular-nums}
  .qi.tot{width:auto;padding:0 6px;color:var(--mut);font-weight:600}
  .qi{width:22px;height:22px;border-radius:6px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;position:relative;overflow:hidden}
  .qi i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
  #rival{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(6px,env(safe-area-inset-top)) + 75px);width:min(380px,40vw);display:flex;gap:8px;padding:3px 8px;border-radius:8px;font-size:10px;pointer-events:none}
  .rv{flex:1;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .rb{flex:1;height:5px;border-radius:3px;background:#0009;overflow:hidden}
  .rb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a5f3fc)}
  .rb.e i{background:linear-gradient(90deg,#c026d3,#f0abfc)}
  #msg{position:absolute;left:50%;top:calc(max(6px,env(safe-area-inset-top)) + 100px);transform:translateX(-50%) translateY(-6px);padding:7px 14px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;font-weight:700}
  #msg.show{opacity:1;transform:translateX(-50%)}
  #tip{position:absolute;display:none;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:600;pointer-events:none;min-width:150px;z-index:5}
  #tip b{font-size:13px;display:block;margin-bottom:3px}
  #tip div{color:var(--mut)}
  /* écrans */
  #overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:10;background:radial-gradient(ellipse at center,rgba(5,7,12,.35),rgba(5,7,12,.8));overflow:auto;padding:12px}
  .box{border-radius:18px;padding:18px 22px;max-width:560px;width:100%;text-align:center;box-shadow:0 0 50px rgba(34,197,94,.12),inset 0 0 40px rgba(134,239,172,.05)}
  .runes{color:#b4533c99;letter-spacing:.6em;font-size:14px;margin-bottom:2px;text-shadow:0 0 8px #7f1d1d}
  .title{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,7.5vh,50px);font-weight:900;letter-spacing:.08em;background:linear-gradient(180deg,#f3e9dc,#b9a48c 45%,#7a1c14 75%,#3a0a08);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #7f1d1d88) drop-shadow(0 3px 0 #000a)}
  .sub i{color:#c9a27c;font-family:Georgia,serif}
  #clock{font-family:Georgia,serif;font-variant-numeric:tabular-nums}
  .sub{color:var(--mut);margin:4px 0 12px;font-weight:600}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .big{flex:1;min-width:120px;padding:11px 14px;border-radius:12px;border:1px solid #ffffff30;font-weight:800;font-size:15px;background:linear-gradient(#3b4b66,#222c3d)}
  .big.g{background:linear-gradient(#16a34a,#166534)} .big.o{background:linear-gradient(#ea580c,#9a3412)} .big.r{background:linear-gradient(#dc2626,#7f1d1d)}
  .big:active{transform:scale(.96)}
  details{margin-top:12px;text-align:left;color:var(--mut);font-weight:500}
  details summary{cursor:pointer;color:var(--txt);font-weight:700;text-align:center}
  details ul{padding-left:18px;margin:8px 0}
  .fac{flex:1;min-width:140px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px 9px;border-radius:14px;border:2px solid #ffffff1f;background:linear-gradient(#241b19,#120d0c);transition:.15s}
  .fac.on{border-color:#c2412d;box-shadow:0 0 22px #7f1d1d77;background:linear-gradient(#3a2420,#1a0f0d)}
  .fac .ico canvas{width:96px;height:72px;display:block}
  .fac b{font-size:16px;font-family:Georgia,serif} .fac small{color:var(--mut);font-weight:500}
  .qrow{margin-top:12px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12px}
  .qbtn{padding:5px 10px;border-radius:8px;border:1px solid #ffffff2a;background:#1e1614;font-weight:700;font-size:12px}
  .qbtn.on{border-color:#c2412d;background:#3a1a14;color:#fff}
  .best{margin-top:10px;color:var(--gold);font-size:12px}
  #rotate{position:fixed;inset:0;z-index:20;background:#0b0e14;display:none;place-items:center;text-align:center;padding:24px;color:var(--mut)}
  #rotate b{display:block;font-size:42px;margin-bottom:8px}
  @media (orientation:portrait) and (max-width:640px){#rotate{display:grid}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <canvas id="mini" class="glass"></canvas>
    <div id="rival" class="glass"><div class="rv"><span id="rvP">Toi 1/8</span><div class="rb"><i id="rbP"></i></div></div><div class="rv"><span id="rvE">Ennemi 1/8</span><div class="rb e"><i id="rbE"></i></div></div></div>
  <div id="top">
    <div class="pill glass" id="era"><small>1/8</small>Préhistoire</div>
    <div class="pill glass" id="clock">🌙 21:00</div>
    <div class="pill glass"><span class="coin"></span><span id="gold">0</span></div>
    <div class="pill glass" id="xpWrap"><div id="xpTxt"><span class="star">★</span><span id="xp">0</span></div><div id="xpBar"><i></i></div></div>
    <button class="ibtn glass" id="evolve">Évoluer ▲</button>
    <span class="sp"></span>
    <button id="special" title="Attaque spéciale"><span id="spIco">☄</span></button>
    <button class="ibtn glass" id="speed">x1</button>
    <button class="ibtn glass" id="sound">🔊</button>
    <button class="ibtn glass" id="pause">❚❚</button>
  </div>
  <div id="bot">
    <div class="dock glass" id="units"><div id="queue"></div></div>
    <div class="dock glass" id="turrets"></div>
  </div>
  <div id="msg" class="glass"></div>
  <div id="tip" class="glass"></div>
</div>
<div id="overlay"><div class="box glass" id="ovbox"></div></div>
<div id="rotate"><div><b>⟳</b>Tourne ton téléphone en mode paysage</div></div>

<script>
"use strict";
// compatibilité anciennes WebView
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ r=Math.min(Math.abs(r)||0,Math.abs(w)/2,Math.abs(h)/2); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };
}
// =====================================================================
//  DONNÉES
// =====================================================================
const W = 2600, GY = 400, VIEW_H = 520, VY0 = 55, US = 1.38; // VY0 : haut de la vue ; US : échelle des unités
const PB = 190, EB = W - 190;
const ERAS = [
  {name:"Préhistoire", sky:["#ff8f4f","#ffd9a0"], sun:"#fff1c1", far:"#d39a6e", mid:"#a8714a", near:"#7d5234", ground:["#8a5a32","#4a2f18"], grass:"#a08040", cloth:"#8b5a2b", pants:"#6b4423", skin:"#d9a066",
   units:["Cogneur","Frondeur","Dompteur","Mammouth"], turrets:["Lance-pierres","Lance-javelots","Catapulte à rochers","Brasier ardent"], special:"Pluie de météores", ico:"☄"},
  {name:"Antiquité", sky:["#3f8fdc","#d4ecfc"], sun:"#fffbe6", far:"#a9bfd2", mid:"#c4ad78", near:"#9a8150", ground:["#b39256","#6e5530"], grass:"#a9a24e", cloth:"#b91c1c", pants:"#7c2d12", skin:"#e0ac69",
   units:["Hoplite","Archer","Cavalier","Éléphant de guerre"], turrets:["Archer posté","Scorpion","Onagre","Baliste lourde"], special:"Volée de flèches", ico:"➶"},
  {name:"Moyen Âge", sky:["#3a6fb8","#c3dbf0"], sun:"#fffbe6", far:"#86a2bb", mid:"#5f8c4a", near:"#45703a", ground:["#4f7a35","#2a4119"], grass:"#6fae48", cloth:"#64748b", pants:"#3f3f46", skin:"#e0ac69",
   units:["Fantassin","Arbalétrier","Chevalier","Bélier blindé"], turrets:["Arbalète de rempart","Mangonneau","Trébuchet","Feu grégeois"], special:"Pluie de feu", ico:"🔥"},
  {name:"Renaissance", sky:["#4f97da","#f7e6c6"], sun:"#fff7d6", far:"#a9b5c6", mid:"#80965a", near:"#5f7740", ground:["#6b7a35","#3a441b"], grass:"#90a84c", cloth:"#7c3aed", pants:"#3b2a5a", skin:"#e0ac69",
   units:["Piquier","Arquebusier","Cuirassier","Chariot de guerre"], turrets:["Couleuvrine","Mortier","Canon de bronze","Orgue à feu"], special:"Bombardement", ico:"💣"},
  {name:"Ère napoléonienne", sky:["#6f8fb6","#ece5d4"], sun:"#fff7e0", far:"#9ea8b6", mid:"#7a8452", near:"#5d6739", ground:["#5e6a32","#333b19"], grass:"#86964a", cloth:"#1e3a8a", pants:"#e5e7eb", skin:"#e0ac69",
   units:["Grenadier","Fusilier","Hussard","Canon de campagne"], turrets:["Fusil de rempart","Obusier","Canon à mitraille","Batterie lourde"], special:"Barrage d'artillerie", ico:"💥"},
  {name:"Grande Guerre", sky:["#6b7078","#c4bba8"], sun:"#f1eadb", far:"#8e8b84", mid:"#6e604c", near:"#54473a", ground:["#5d4a35","#30241a"], grass:"#6e5e42", cloth:"#6b7a8f", pants:"#55606e", skin:"#e0ac69",
   units:["Fantassin","Tireur","Lance-flammes","Char d'assaut"], turrets:["Mitrailleuse","Mortier de tranchée","Canon antichar","Obusier lourd"], special:"Bombardement aérien", ico:"✈"},
  {name:"Seconde Guerre", sky:["#5b7891","#d6cbb3"], sun:"#fff1d6", far:"#8f989f", mid:"#617048", near:"#4a5636", ground:["#4f5a33","#2a301a"], grass:"#6b7c40", cloth:"#556b2f", pants:"#3f4f24", skin:"#e0ac69",
   units:["Soldat","Mitrailleur","Jeep armée","Char lourd"], turrets:["Mitrailleuse lourde","Canon antichar","Lance-roquettes","Canon de DCA"], special:"Raid de bombardiers", ico:"✈"},
  {name:"Ère moderne", sky:["#2563a8","#d8eaf8"], sun:"#ffffff", far:"#a7b7ca", mid:"#bdb08e", near:"#9a8e70", ground:["#8a7f69","#4f4739"], grass:"#a39878", cloth:"#8a7d5c", pants:"#6b6248", skin:"#e0ac69",
   units:["Commando","Tireur d'élite","Blindé léger","Char de combat"], turrets:["Mitrailleuse rotative","Lance-grenades","Lance-missiles","Canon laser"], special:"Frappe de missiles", ico:"🚀"},
];
// Ambiance lovecraftienne : chaque époque se déroule sous un ciel nocturne étrange
const ELD = [
  {sky:["#120c24","#6b3a52"], moon:"#ffd9a8", fog:"#a07090", far:"#4a2c4a", mid:"#3a2438", near:"#2e1d2c", ground:["#3d2a22","#1a110d"], grass:"#5a4a2a", shade:"#1a0f24"},
  {sky:["#0b1830","#4f6a7a"], moon:"#e8f5e0", fog:"#7aa093", far:"#3d5560", mid:"#4a4a3a", near:"#3a3a2c", ground:["#5a4a30","#241c10"], grass:"#6b6a3a", shade:"#0b1424"},
  {sky:["#0a1424","#3d5a5a"], moon:"#d8ffe0", fog:"#6aa08a", far:"#2e4a4a", mid:"#2a4030", near:"#1f3324", ground:["#2a3d22","#0f180c"], grass:"#3f6b35", shade:"#08141a"},
  {sky:["#1a1030","#7a4a5a"], moon:"#ff9a8a", fog:"#9a6a7a", far:"#4a3a50", mid:"#3a3a30", near:"#2c2c22", ground:["#3a3a22","#15150c"], grass:"#5a6a35", shade:"#1a0c1c"},
  {sky:["#141c2a","#5a6070"], moon:"#e0f0ff", fog:"#8090a0", far:"#3a4250", mid:"#363c2c", near:"#2a2e22", ground:["#353a22","#14160c"], grass:"#55603a", shade:"#0e1420"},
  {sky:["#14140f","#4f5230"], moon:"#d4ff9a", fog:"#8a9a5a", far:"#3a3a2c", mid:"#33291f", near:"#281f18", ground:["#33281e","#120d09"], grass:"#4a3f2c", shade:"#12140a"},
  {sky:["#0c1418","#3a4a40"], moon:"#c8ffd8", fog:"#6a8a78", far:"#2c3a36", mid:"#2c3424", near:"#22281c", ground:["#2e3420","#10120a"], grass:"#46522e", shade:"#081210"},
  {sky:["#05081a","#2e1d52"], moon:"#b8f0ff", fog:"#7a5aaa", far:"#2a2050", mid:"#2a2638", near:"#201c2a", ground:["#2e2a30","#0e0c10"], grass:"#3c3848", shade:"#0a0618"},
];
ERAS.forEach((e,i)=>Object.assign(e, ELD[i]));
const STARS = Array.from({length:110}, (_,i)=>({x:Math.sin(i*91.7)*0.5+0.5, y:hash0(i*3.1), r:hash0(i*7.3)<0.15?2:1.2, b:0.4+hash0(i*5.9)*0.6, f:1+hash0(i)*3, p:i}));
function hash0(i){ const s = Math.sin(i*127.1+311.7)*43758.5453; return s - Math.floor(s); }
const XP_REQ = [1000, 3000, 7000, 15000, 32000, 68000, 140000];
const SLOT_COST = [0, 800, 2500, 7000];
const SPECIAL_CD = 45;
const statMul = e => Math.pow(1.8, e);
const costMul = e => Math.pow(1.75, e);

// Faction des Créatures (mêmes règles, autre bestiaire)
const CRE = {
  skin:["#9aa088","#5f8a7e","#8a8566","#7e4646","#5e4a7a","#4e4034","#30504c","#2c2646"],
  glow:["#e6f5b0","#b6e35a","#84cc16","#facc15","#fb923c","#ef4444","#c084fc","#22d3ee"],
  units:[
    ["Rampant des grèves","Profond","Profond cuirassé","Hybride des récifs","Écorcheur des brumes","Égorgeur du gouffre","Profond d'élite","Avatar abyssal"],
    ["Œil larvaire","Œil rôdeur","Œil ancien","Œil des cryptes","Œil de brume","Œil du gouffre","Œil stellaire","Œil omniscient"],
    ["Molosse des grottes","Molosse des marais","Horreur rampante","Chimère des angles","Traqueur de brume","Molosse du gouffre","Masse informe","Shoggoth ancien"],
    ["Larve colossale","Kraken des marais","Béhémoth corallien","Colosse des abysses","Rejeton des brumes","Rejeton du gouffre","Rejeton stellaire","Grand Ancien"]],
  turrets:["Polype cracheur","Œil veilleur","Sac de bile","Tentacule de siège"],
  suffix:["primordial","des marais","des cryptes","des abysses","des brumes","du gouffre","stellaire","des Anciens"],
  special:["Pluie d'abîme","Marée noire","Nuée d'yeux","Chant des abysses","Brume dévorante","Rêve du Dormeur","Faille stellaire","Éveil des Anciens"],
};
const ORG = new Set(["foot","flame","mount","beast","deep","eye","hound","shoggoth","spawn"]);
const CREATURE_V = new Set(["deep","eye","hound","shoggoth","spawn"]);
const crSize = e => 0.86 + e*0.075;
const specialName = s => s.fac==="c" ? CRE.special[s.era] : ERAS[s.era].special;
function unitDef(era, k, fac="h"){
  const B = [
    {hp:60, dmg:15, range:6,   cd:1.0, speed:44, cost:15,  time:2},
    {hp:40, dmg:10, range:160, cd:1.3, speed:42, cost:25,  time:3},
    {hp:180,dmg:30, range:6,   cd:1.1, speed:36, cost:100, time:6},
    {hp:450,dmg:55, range:8,   cd:1.5, speed:26, cost:200, time:12},
  ][k];
  const d = Object.assign({splash:0}, B);
  // Unité 3 : 6 s, puis 9 s à partir de l'époque 7
  if(k===2 && era>=6){ d.time=9; d.hp*=1.5; d.cost*=1.4; d.range=150; d.dmg*=1.1; d.cd=0.9; d.speed=46; }
  if(k===2 && era===5){ d.range=60; }
  // Unité 4 : 12 s, puis 20 s à partir de l'époque 5
  if(k===3 && era>=4){ d.time=20; d.hp*=1.7; d.dmg*=1.6; d.cost*=1.6; d.range=220; d.splash=40; d.cd=2.2; d.speed=24; }
  const g = statMul(era), c = costMul(era);

function turretDef(era,k,fac="h"){

function audio(){
  if(!SFX.ac){ const A = window.AudioContext||window.webkitAudioContext; if(!A) return null; SFX.ac = new A();
    const len = SFX.ac.sampleRate*0.6, b = SFX.ac.createBuffer(1,len,SFX.ac.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1; SFX.noise = b; }
  if(SFX.ac.state==="suspended") SFX.ac.resume();
  return SFX.ac;
}
function sfx(type, vol=1){
  if(!SFX.on || (G && G.demo)) return;
  const now = performance.now(); if(SFX.last[type] && now-SFX.last[type] < 75) return; SFX.last[type] = now;
  const a = audio(); if(!a) return;
  const t = a.currentTime, out = a.createGain(); out.connect(a.destination);
  const noise = (dur, f, q, v, type2="bandpass") => { const s=a.createBufferSource(); s.buffer=SFX.noise; const fl=a.createBiquadFilter(); fl.type=type2; fl.frequency.value=f; fl.Q.value=q; const g=a.createGain(); g.gain.setValueAtTime(v*vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t+dur); };
  const tone = (f1, f2, dur, v, w="sine", delay=0) => { const o=a.createOscillator(); o.type=w; o.frequency.setValueAtTime(f1,t+delay); o.frequency.exponentialRampToValueAtTime(f2,t+delay+dur); const g=a.createGain(); g.gain.setValueAtTime(0.0001,t+delay); g.gain.linearRampToValueAtTime(v*vol,t+delay+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+delay+dur); o.connect(g); g.connect(out); o.start(t+delay); o.stop(t+delay+dur+0.02); };
  switch(type){
    case "melee": noise(0.07, 1800, 1.2, 0.18); break;
    case "shot": noise(0.09, 2500, 0.7, 0.16, "highpass"); break;
    case "arrow": tone(900, 400, 0.12, 0.05, "triangle"); break;
    case "boom": noise(0.5, 180, 0.8, 0.45, "lowpass"); tone(90, 35, 0.4, 0.25); break;
    case "coin": tone(1300, 1300, 0.06, 0.05, "square"); tone(1750, 1750, 0.09, 0.05, "square", 0.06); break;
    case "build": tone(300, 600, 0.12, 0.07, "triangle"); break;
    case "evolve": [523,659,784,1047].forEach((f,i)=>tone(f, f, 0.22, 0.08, "triangle", i*0.11)); break;
    case "special": tone(220, 60, 1.0, 0.12, "sawtooth"); noise(1.0, 400, 0.6, 0.15, "lowpass"); break;
    case "spit": tone(320, 110, 0.14, 0.06, "square"); noise(0.1, 900, 1, 0.08); break;
    case "thunder": noise(1.6, 120, 0.7, 0.55, "lowpass"); tone(55, 28, 1.4, 0.2); break;
    case "click": tone(700, 500, 0.05, 0.05, "triangle"); break;
    case "lose": [392,330,262].forEach((f,i)=>tone(f, f*0.97, 0.35, 0.09, "triangle", i*0.25)); break;

const PSPEED = {acid:460, beam:5000, bile:420, orb:500, stone:420, arrow:520, bolt:600, bullet:1100, flame:300, shell:520, rock:380, fire:420, laser:5000, missile:620};
function fire(target, def, side, x, y, src){
  const tx = target.base ? (side===G.p ? EB : PB) : target.x;
  const ty = target.base ? GY-70 : GY - target.def.h*0.55;
  const dist = Math.hypot(tx-x, ty-y);
  G.proj.push({x, y, sx:x, sy:y, tx, ty, target, t:0, dur:Math.max(0.05, dist/(PSPEED[def.proj]||500)), dmg:def.dmg*(src ? src.dm : 1), splash:def.splash||0, side, kind:def.proj, src,
    arc: ["stone","rock","shell","fire","acid","bile"].includes(def.proj) ? Math.min(150, dist*0.28) : def.proj==="arrow"||def.proj==="bolt" ? Math.min(60,dist*0.12) : def.proj==="missile" ? Math.min(90,dist*0.2) : 0, init:true});
  if(onScreen(x)){
    if(def.proj==="bullet"||def.proj==="shell"){ muzzle(x,y,side.dir,def.proj==="shell"); sfx(def.proj==="shell"?"boom":"shot", def.proj==="shell"?0.35:0.7); }

function step(dt){
  G.t += dt;
  for(const s of [G.p, G.e]){
    s.gold += income(s.era)*dt*(s===G.e?G.diff.mul:1);
    s.specialCd = Math.max(0, s.specialCd-dt);
    if(s.queue.length){
      const d = s.queue[0];
      const spawnX = s.front + s.dir*(d.w/2+4);
      const blocked = s.units.some(u => Math.abs(u.x - spawnX) < (u.def.w+d.w)/2 + 2);
      if(s.prodT < d.time) s.prodT += dt;
      if(s.prodT >= d.time && !blocked){
        s.units.push({id:++G.uid, def:d, x:spawnX, hp:d.hp, maxHp:d.hp, dm:1, lvl:0, kills:0, cdT:0.3, walk:Math.random()*5, atk:0, hit:0, dead:false, moving:false});
        s.queue.shift(); s.prodT = 0;
      }
    }
    // fumée sur base endommagée
    const r = s.hp/s.maxHp;
    if(r<0.6 && Math.random() < (0.6-r)*0.4) puff((s.id===0?60:W-60)+(Math.random()-0.5)*90, GY-120-Math.random()*40, 1, r<0.3?"#292524":"#78716c", 12);
    if(r<0.3 && Math.random()<0.25) addPart({type:"spark", x:(s.id===0?80:W-80)+(Math.random()-0.5)*80, y:GY-110, vx:(Math.random()-0.5)*20, vy:-60, life:0.5, max:0.5, r:3, c:Math.random()<0.5?"#f97316":"#fde047", g:-40});
  }
  for(const s of [G.p, G.e]){

function ai(s){
  const o = opp(s);

  const threat = o.units.filter(u => Math.abs(u.x - s.front) < 900).length;
  if(s.specialCd<=0 && (threat>=5 || (threat>=2 && s.hp < s.maxHp*0.5))) useSpecial(s);
  for(let i=0;i<s.slots;i++){ const t=s.turrets[i]; if(t && t.def.era < s.era && s.gold > TD(s.era,t.def.k,s.fac).cost*2.5){ sellTurret(s,i); buyTurret(s,Math.min(3,t.def.k+1)); } }
  // ---- production adaptative : selon l'or, l'XP et l'armée qui arrive en face ----
  const val = u => u.def.cost * (u.hp/(u.maxHp||u.def.hp)) * (1 + (u.lvl||0)*0.3);
  const near = u => 1 + Math.max(0, 1 - Math.abs(u.x - s.front)/(W*0.6));        // plus menaçant quand il approche
  const enemyStr = o.units.reduce((a,u)=>a + val(u)*near(u), 0) + o.queue.reduce((a,d)=>a + d.cost*0.6, 0);
  const ownStr = s.units.reduce((a,u)=>a + val(u), 0) + s.queue.reduce((a,d)=>a + d.cost*0.8, 0);
  const ratio = (enemyStr + 1) / (ownStr + 1);
  const danger = o.units.some(u => Math.abs(u.x - s.front) < 450);
  const nearEvo = s.era < 7 && s.xp >= XP_REQ[s.era]*0.85;
  // composition adverse → contre
  const nR = o.units.filter(u=>u.def.range>10).length, nH = o.units.filter(u=>u.def.k>=2).length, nT = Math.max(1, o.units.length);
  const skill = {facile:0.55, normal:0.8, difficile:1}[s===G.e ? G.diffKey : "normal"] ?? 0.8;
  const base = {facile:[0.42,0.3,0.18,0.1], normal:[0.3,0.28,0.23,0.19], difficile:[0.24,0.26,0.26,0.24]}[s===G.e ? G.diffKey : "normal"] || [0.3,0.28,0.23,0.19];
  const wts = base.slice();
  wts[0] += skill*0.25*(nR/nT); wts[2] += skill*0.2*(nR/nT);          // beaucoup de tireurs → mêlée rapide + lourds
  wts[1] += skill*0.2*(nH/nT); wts[3] += skill*0.25*(nH/nT);          // beaucoup de lourds → tireurs + super-unités
  if(ratio > 1.4) { wts[0] += 0.15; wts[1] += 0.1; }                    // débordé : unités rapides à produire
  const pick = () => { const tot = wts.reduce((a,b)=>a+b,0); let r = Math.random()*tot, k = 0; for(; k<3; k++){ r -= wts[k]; if(r < 0) break; } return k; };

  const planCost = UD(s.era, s.aiPlan, s.fac).cost;
  // combien produire : rien n'est fixé, cela dépend du rapport de force et de l'or
  const want = danger || ratio > 1.6 ? 5 : ratio > 1.1 ? 3 : ratio > 0.7 ? 2 : 1;
  // tourelles / emplacements : seulement avec un surplus, et pas juste avant d'évoluer
  const reserve = (s.aiPlan>=2 ? planCost : 0) + (danger ? 0 : planCost*0.3);

    if(free){ for(let k=3;k>=0;k--){ const c=TD(s.era,k,s.fac).cost; if(s.gold >= c*1.3 + reserve && Math.random()<0.5*skill+0.2){ buyTurret(s,k); break; } } }

    if(s.gold >= planCost){ queueUnit(s, s.aiPlan); s.aiPlan = pick(); continue; }
    if(danger || ratio > 1.3 || (s.units.length===0 && s.queue.length===0)){

      if(s.gold >= UD(s.era,k,s.fac).cost){ queueUnit(s,k); continue; }
    }
    break;   // sinon : on économise pour l'unité prévue
  }
}

$("speed").onclick = ()=>{ G.speed = G.speed===1?2:G.speed===2?3:1; $("speed").textContent="x"+G.speed; };
$("pause").onclick = ()=>togglePause();
$("sound").onclick = ()=>{ SFX.on=!SFX.on; $("sound").textContent = SFX.on?"🔊":"🔇"; try{ localStorage.setItem("fdt_mute", SFX.on?"0":"1"); }catch(e){} if(SFX.on) audio(); };
$("sound").textContent = SFX.on?"🔊":"🔇";
function togglePause(force){
  if(!G || G.over || G.demo) return;
  G.paused = force!==undefined ? force : !G.paused;
  $("pause").textContent = G.paused?"▶":"❚❚";
  if(G.paused) showOverlay(`<h1 class="title">PAUSE</h1><p class="sub">${ERAS[G.p.era].name} · ${fmtTime(G.t)} · ${G.diff.label}</p>
    <div class="row"><button class="big g" onclick="togglePause(false)">Reprendre</button><button class="big" onclick="startMenu()">Quitter</button></div>${qualityRow()}`);
  else hideOverlay();
}
// bouton retour Android (appelé par l'application)
window.androidBack = function(){
  if(!G || G.demo) return false;
  if(G.over){ startMenu(); return true; }
  togglePause(!G.paused); return true;
};
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && G && !G.demo && !G.over && !G.paused) togglePause(true); });

// =====================================================================
//  BOUCLE
// =====================================================================
let last = performance.now(), hudT = 0;
let renderedPaused = false;
function loop(now){
  requestAnimationFrame(loop);
  const fps = G && G.demo ? 20 : QMODES[QMODE].fps;
  if(now - last < 1000/fps - 2) return;          // limite d'images par seconde (économie de batterie)
  const dt = Math.min(0.05,(now-last)/1000); if(G && !G.paused && !G.demo && !document.hidden) adaptQuality(now-last); last = now;
  if(G && G.paused){ if(!renderedPaused){ render(); refreshHud(); renderedPaused = true; } return; }   // en pause : on ne redessine plus
  renderedPaused = false;
  if(G){
    if(keys["arrowleft"]||keys["q"]||keys["a"]){ G.cam -= 800*dt; G.camTarget=null; }
    if(keys["arrowright"]||keys["d"]){ G.cam += 800*dt; G.camTarget=null; }
    if(G.camVel){ G.cam += G.camVel*dt; G.camVel *= Math.pow(0.04, dt); if(Math.abs(G.camVel)<5) G.camVel=0; }
    if(G.demo){ const all=[...G.p.units,...G.e.units]; const c = all.length ? all.reduce((a,u)=>a+u.x,0)/all.length : W/2; G.camTarget = c - viewW/2; }
    if(G.camTarget!=null){ G.cam += (G.camTarget - G.cam)*Math.min(1, dt*(G.demo?1.2:8)); if(!G.demo && Math.abs(G.camTarget-G.cam)<1) G.camTarget=null; }
    if(!G.paused && !G.over){ for(let i=0;i<G.speed;i++) step(dt); }
    render();
    bakeTick(6);
    if(now-hudT>150 && !G.demo){ refreshHud(); hudT=now; }
  }
}
function showOverlay(html){ $("ovbox").innerHTML=html; $("overlay").style.display="grid"; }
function hideOverlay(){ $("overlay").style.display="none"; }
function setHud(v){ for(const id of ["top","bot","mini","rival"]) $(id).style.visibility = v?"visible":"hidden"; }
function startMenu(){
  newGame("normal", true); setHud(false);
  let best = null; try{ best = JSON.parse(localStorage.getItem("fdt_best")||"null"); }catch(e){}
  showOverlay(`<div class="runes">ᛟ ✶ ᚦ ✶ ᛉ</div><h1 class="title">FRONTS DU TEMPS</h1>
  <p class="sub">De la Préhistoire à l'ère moderne, 8 époques de guerre<br><i>…sous le regard de ce qui rêve entre les étoiles.</i></p>
  <div class="row"><button class="fac ${pickFac==="h"?"on":""}" id="facH" onclick="pickF('h')"><span class="ico"></span><b>Humains</b><small>De la massue au char de combat</small></button>
  <button class="fac ${pickFac==="c"?"on":""}" id="facC" onclick="pickF('c')"><span class="ico"></span><b>Créatures</b><small>Ce qui rampe sous le monde</small></button></div>
  <div class="row"><button class="big g" onclick="go('facile')">Facile</button><button class="big o" onclick="go('normal')">Normal</button><button class="big r" onclick="go('difficile')">Difficile</button></div>
  ${qualityRow()}
  ${best?`<div class="best">★ Meilleur résultat : victoire en ${DIFF[best.d].label} en ${fmtTime(best.t)}</div>`:""}
  <details><summary>Comment jouer</summary><ul>
    <li><b>Or</b> : produis des unités (en bas à gauche) et des tourelles (en bas à droite). Tuer des ennemis rapporte de l'or.</li>
    <li><b>XP ★</b> : gagnée au combat. Quand la barre est pleine, appuie sur <b>Évoluer</b> pour passer à l'époque suivante.</li>
    <li><b>Attaque spéciale</b> (bouton rond) : dévastatrice, recharge ${SPECIAL_CD} s.</li>
    <li>Production : 2 s (mêlée), 3 s (distance), 6 s (9 s à l'époque 7), 12 s (20 s dès l'époque 5). File de 5 unités.</li>
    <li>Tourelles : jusqu'à 4 emplacements, revente à 50 %. Appui long sur un bouton = détails.</li>
    <li>Glisse sur l'écran ou touche la mini-carte pour te déplacer.</li>
  </ul></details>`);
  $("facH").querySelector(".ico").appendChild(unitIcon(UD(5,3,"h"), "#3b82f6"));
  $("facC").querySelector(".ico").appendChild(unitIcon(UD(6,3,"c"), "#a855f7"));
}
let pickFac = "h";
try{ pickFac = localStorage.getItem("fdt_fac")==="c" ? "c" : "h"; }catch(e){}
function pickF(f){ pickFac = f; try{ localStorage.setItem("fdt_fac", f); }catch(e){} $("facH").classList.toggle("on", f==="h"); $("facC").classList.toggle("on", f==="c"); sfx("click"); }
function go(d){ hideOverlay(); newGame(d, false, pickFac); setHud(true); resize(); G.cam=0; last=performance.now(); sfx("click"); }
resize(); startMenu(); requestAnimationFrame(loop);
</script>
</body>
</html>
