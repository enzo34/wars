<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fronts du Temps</title>
<style>
  :root{--bg:#0f1115;--panel:#1a1e26;--panel2:#232935;--txt:#e8ecf2;--mut:#9aa4b2;--gold:#f5c542;--xp:#7dd3fc;--ok:#22c55e;--bad:#ef4444;--acc:#3b82f6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none}
  #app{display:flex;flex-direction:column;height:100%}
  #top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);flex-wrap:wrap}
  .stat{display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
  .gold{color:var(--gold)} .xp{color:var(--xp)}
  #eraName{font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel2)}
  #xpbar{width:120px;height:8px;background:#000;border-radius:4px;overflow:hidden}
  #xpbar>div{height:100%;background:var(--xp);width:0}
  .sp{flex:1}
  button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid #333b4a;border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover:not(:disabled){border-color:#5b6b85}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.on{background:#7c2d12;border-color:#f97316}
  #evolve:not(:disabled){background:#14532d;border-color:var(--ok)}
  #special{position:relative;overflow:hidden}
  #special .cd{position:absolute;left:0;bottom:0;height:3px;background:#f97316}
  #stage{position:relative;flex:1;min-height:0}
  canvas#c{display:block;width:100%;height:100%;touch-action:none}
  #mini{position:absolute;left:50%;transform:translateX(-50%);top:6px;width:min(420px,70%);height:22px;border:1px solid #ffffff40;border-radius:4px;background:#00000055;cursor:pointer}
  #msg{position:absolute;left:50%;top:38px;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #bottom{background:var(--panel);padding:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
  .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
  .grp h4{margin:0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
  .card{display:flex;flex-direction:column;align-items:flex-start;min-width:112px;text-align:left;padding:5px 8px}
  .card b{font-size:13px}
  .card small{color:var(--mut);font-size:11px}
  .card .c{color:var(--gold);font-size:12px;font-weight:600}
  #queue{display:flex;align-items:center;gap:4px;min-width:150px;padding:0 6px}
  .qi{width:24px;height:24px;border-radius:5px;background:var(--panel2);border:1px solid #333b4a;display:grid;place-items:center;font-size:11px;font-weight:700;position:relative;overflow:hidden}
  .qi .p{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
  #overlay{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:10}
  .box{background:var(--panel);border:1px solid #333b4a;border-radius:14px;padding:22px;max-width:560px;width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto}
  .box h1{margin:0 0 6px;font-size:26px}
  .box p{color:var(--mut);margin:6px 0}
  .box ul{color:var(--mut);padding-left:18px;margin:8px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .row button{flex:1;padding:10px;font-weight:700}
  @media (max-width:700px){#bottom{gap:4px;padding:4px}.grp{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}.card{min-width:0;padding:3px 5px}.card b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.card small{font-size:10px}.card small.d{display:none}.grp h4{display:none}#xpbar{width:70px}#queue{width:100%;justify-content:center}#top{gap:6px;padding:4px 6px}#top button{padding:4px 8px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span id="eraName">Préhistoire</span>
    <span class="stat gold">● <span id="gold">0</span></span>
    <span class="stat xp">★ <span id="xp">0</span></span>
    <div id="xpbar"><div></div></div>
    <button id="evolve" disabled>Évoluer</button>
    <button id="special"><span id="spName">Spécial</span><div class="cd"></div></button>
    <span class="sp"></span>
    <button id="speed">x1</button>
    <button id="pause">❚❚</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="mini"></canvas>
    <div id="msg"></div>
  </div>
  <div id="bottom">
    <div class="grp" id="units"><h4>Unités</h4></div>
    <div id="queue"></div>
    <div class="grp" id="turrets"><h4>Tourelles</h4></div>
    <div class="grp"><button id="slot" class="card"><b>+ Emplacement</b><span class="c" id="slotCost"></span></button>
      <button id="sell" class="card"><b>Vendre</b><small>tourelle (50%)</small></button></div>
  </div>
</div>
<div id="overlay"><div class="box" id="ovbox"></div></div>

<script>
"use strict";
// ================= DONNÉES =================
const W = 2600, GY = 400, VIEW_H = 480;
const PB = 190, EB = W - 190; // fronts des bases
const ERAS = [
  {name:"Préhistoire", sky:["#f6b26b","#fde7c4"], ground:"#7a5a35", hill:"#a07a4a", cloth:"#8b5a2b", skin:"#d9a066",
   units:["Cogneur","Frondeur","Dompteur","Mammouth"], turrets:["Lance-pierres","Lance-javelots","Catapulte à rochers","Brasier ardent"], special:"Pluie de météores"},
  {name:"Antiquité", sky:["#7fb3e6","#e9f3fb"], ground:"#9b8455", hill:"#c2b280", cloth:"#b91c1c", skin:"#e0ac69",
   units:["Hoplite","Archer","Cavalier","Éléphant de guerre"], turrets:["Archer posté","Scorpion","Onagre","Baliste lourde"], special:"Volée de flèches"},
  {name:"Moyen Âge", sky:["#5d7fa8","#cfd9e6"], ground:"#4b6b33", hill:"#6b8e4e", cloth:"#6b7280", skin:"#e0ac69",
   units:["Fantassin","Arbalétrier","Chevalier","Bélier blindé"], turrets:["Arbalète de rempart","Mangonneau","Trébuchet","Feu grégeois"], special:"Pluie de feu"},
  {name:"Renaissance", sky:["#6aa1d8","#f2e8d5"], ground:"#5d6b2f", hill:"#87914f", cloth:"#7c3aed", skin:"#e0ac69",
   units:["Piquier","Arquebusier","Cuirassier","Chariot de guerre"], turrets:["Couleuvrine","Mortier","Canon de bronze","Orgue à feu"], special:"Bombardement"},
  {name:"Ère napoléonienne", sky:["#8fa9c4","#e5e7eb"], ground:"#56622e", hill:"#7b8450", cloth:"#1e3a8a", skin:"#e0ac69",
   units:["Grenadier","Fusilier","Hussard","Canon de campagne"], turrets:["Fusil de rempart","Obusier","Canon à mitraille","Batterie lourde"], special:"Barrage d'artillerie"},
  {name:"Grande Guerre", sky:["#8a8f96","#c9c4b5"], ground:"#5b4a36", hill:"#766652", cloth:"#6b7a8f", skin:"#e0ac69",
   units:["Fantassin","Tireur","Lance-flammes","Char d'assaut"], turrets:["Mitrailleuse","Mortier de tranchée","Canon antichar","Obusier lourd"], special:"Bombardement aérien"},
  {name:"Seconde Guerre", sky:["#7c93a8","#d6dde3"], ground:"#4f5a35", hill:"#6c7650", cloth:"#4d5d33", skin:"#e0ac69",
   units:["Soldat","Mitrailleur","Jeep armée","Char lourd"], turrets:["Mitrailleuse lourde","Canon antichar","Lance-roquettes","Canon de DCA"], special:"Raid de bombardiers"},
  {name:"Ère moderne", sky:["#3b6ea8","#cfe3f5"], ground:"#6b6355", hill:"#8b8270", cloth:"#57534e", skin:"#e0ac69",
   units:["Commando","Tireur d'élite","Blindé léger","Char de combat"], turrets:["Mitrailleuse rotative","Lance-grenades","Lance-missiles","Canon laser"], special:"Frappe de missiles"},
];
// XP cumulée nécessaire pour passer à l'époque suivante
const XP_REQ = [1000, 3000, 7000, 15000, 32000, 68000, 140000];
const SLOT_COST = [0, 800, 2500, 7000];
const SPECIAL_CD = 45;

const statMul = e => Math.pow(1.8, e);
const costMul = e => Math.pow(1.75, e);

function unitDef(era, k){
  const B = [
    {hp:60, dmg:15, range:6,   cd:1.0, speed:44, cost:15,  time:2},
    {hp:40, dmg:10, range:160, cd:1.3, speed:42, cost:25,  time:3},
    {hp:180,dmg:30, range:6,   cd:1.1, speed:36, cost:100, time:6},
    {hp:450,dmg:55, range:8,   cd:1.5, speed:26, cost:200, time:12},
  ][k];
  const d = Object.assign({splash:0}, B);
  // Unité 3 : 6 s, puis 9 s à partir de l'époque 7 (véhicule)
  if(k===2 && era>=6){ d.time=9; d.hp*=1.5; d.cost*=1.4; d.range=150; d.dmg*=1.1; d.cd=0.9; d.speed=46; }
  if(k===2 && era===5){ d.range=60; }
  // Unité 4 : 12 s, puis 20 s à partir de l'époque 5 (artillerie / blindé)
  if(k===3 && era>=4){ d.time=20; d.hp*=1.7; d.dmg*=1.6; d.cost*=1.6; d.range=220; d.splash=40; d.cd=2.2; d.speed=24; }
  const g = statMul(era), c = costMul(era);
  d.hp = Math.round(d.hp*g); d.dmg = Math.round(d.dmg*g); d.cost = Math.round(d.cost*c);
  d.visual = unitVisual(era,k);
  d.w = {foot:20, mount:34, flame:24, beast:62, ram:56, wagon:58, cannon:46, tank:66, jeep:52}[d.visual];
  d.h = {foot:38, mount:52, flame:40, beast:62, ram:40, wagon:44, cannon:30, tank:40, jeep:34}[d.visual];
  d.proj = projKind(era,k);
  d.name = ERAS[era].units[k];
  d.era = era; d.k = k;
  return d;
}
function unitVisual(e,k){
  if(k<2) return "foot";
  if(k===2) return e>=6 ? "jeep" : e===5 ? "flame" : "mount";
  if(e<=1) return "beast";
  if(e===2) return "ram";
  if(e===3) return "wagon";
  if(e===4) return "cannon";
  return "tank";
}
function projKind(e,k){
  if(k===1) return e===0?"stone":e===1?"arrow":e===2?"bolt":"bullet";
  if(k===2) return e>=6?"bullet":e===5?"flame":null;
  if(k===3) return e>=4?"shell":null;
  return null;
}
function turretDef(era,k){
  const B = [
    {dmg:8,  cd:0.6, range:320, splash:0,  cost:100},
    {dmg:20, cd:1.2, range:380, splash:0,  cost:250},
    {dmg:22, cd:1.8, range:340, splash:55, cost:500},
    {dmg:45, cd:1.5, range:450, splash:25, cost:1000},
  ][k];
  const g = statMul(era), c = costMul(era);
  const proj = k===0 ? (era<3?"stone":"bullet") : k===1 ? (era<3?"arrow":"bullet") : k===2 ? (era<3?"rock":"shell") : (era===7?"laser":era<3?"fire":"shell");
  return {dmg:Math.round(B.dmg*g), cd:B.cd, range:B.range, splash:B.splash, cost:Math.round(B.cost*c), proj, era, k, name:ERAS[era].turrets[k]};
}
const DEF_CACHE = {};
const UD = (e,k) => DEF_CACHE["u"+e+k] || (DEF_CACHE["u"+e+k] = unitDef(e,k));
const TD = (e,k) => DEF_CACHE["t"+e+k] || (DEF_CACHE["t"+e+k] = turretDef(e,k));
const baseMaxHp = e => Math.round(1500*Math.pow(1.7,e));
const income = e => 1.5*Math.pow(1.6,e);

// ================= ÉTAT =================
let G = null;
const DIFF = {facile:{mul:0.75,think:1.4}, normal:{mul:1,think:1}, difficile:{mul:1.35,think:0.7}};
function newSide(id){
  return {id, dir:id===0?1:-1, front:id===0?PB:EB, gold:175, xp:0, era:0, hp:baseMaxHp(0), maxHp:baseMaxHp(0),
    queue:[], prodT:0, units:[], turrets:[null,null,null,null], slots:1, specialCd:12, auto:false, think:0, team:id===0?"#3b82f6":"#ef4444"};
}
function newGame(diff){
  G = {p:newSide(0), e:newSide(1), proj:[], parts:[], texts:[], cam:0, speed:1, paused:false, over:false, t:0, diff:DIFF[diff], sellMode:false, uid:0};
  G.e.auto = true;
  if(location.hash.includes("auto")) G.p.auto = true;
  window.__G = G;
  buildButtons(); refreshHud(true);
}
const opp = s => s===G.p ? G.e : G.p;

// ================= ACTIONS =================
function canQueue(s,k){ return s.queue.length<5 && s.gold>=UD(s.era,k).cost; }
function queueUnit(s,k){
  if(!canQueue(s,k)) return false;
  const d = UD(s.era,k); s.gold -= d.cost; s.queue.push(d); return true;
}
function canEvolve(s){ return s.era<7 && s.xp>=XP_REQ[s.era]; }
function evolve(s){
  if(!canEvolve(s)) return;
  const r = s.hp/s.maxHp; s.era++; s.maxHp = baseMaxHp(s.era); s.hp = Math.round(s.maxHp*r);
  if(s===G.p){ flash("Nouvelle époque : "+ERAS[s.era].name); buildButtons(); }
}
function useSpecial(s){
  if(s.specialCd>0) return;
  s.specialCd = SPECIAL_CD;
  const o = opp(s), n = 16, dmg = Math.round(70*statMul(s.era));
  for(let i=0;i<n;i++){
    let x;
    if(o.units.length && Math.random()<0.75){ x = o.units[(Math.random()*o.units.length)|0].x + (Math.random()-0.5)*60; }
    else x = s.front + s.dir*(150 + Math.random()*(W-PB*2-200));
    x = Math.max(PB+20, Math.min(EB-20, x));
    G.proj.push({x:x+(Math.random()-0.5)*200 - s.dir*120, y:-40 - Math.random()*300, tx:x, ty:GY, t:0, dur:0.9+Math.random()*0.8, sx:0, sy:0,
      dmg, splash:50, side:s, kind:"meteor", era:s.era, special:true, init:false});
  }
  if(s===G.p) flash(ERAS[s.era].special+" !");
}
function buyTurret(s,k){
  const d = TD(s.era,k); const i = s.turrets.findIndex((t,j)=>j<s.slots && !t);
  if(i<0){ if(s===G.p) flash("Aucun emplacement libre — vends une tourelle ou ajoute un emplacement"); return false; }
  if(s.gold<d.cost) return false;
  s.gold -= d.cost; s.turrets[i] = {def:d, cdT:0, ang:0}; return true;
}
function sellTurret(s,i){
  const t = s.turrets[i]; if(!t) return;
  s.gold += Math.round(t.def.cost/2); s.turrets[i] = null;
  addText(turretPos(s,i).x, turretPos(s,i).y-20, "+"+Math.round(t.def.cost/2), "#f5c542");
}
function buySlot(s){
  if(s.slots>=4 || s.gold<SLOT_COST[s.slots]) return false;
  s.gold -= SLOT_COST[s.slots]; s.slots++; return true;
}
function turretPos(s,i){ return {x: s.id===0 ? 120 : W-120, y: GY-150-i*42}; }

// ================= SIMULATION =================
function frontOf(units){ return units.length ? units[0] : null; }
function damageUnit(u, dmg, by){
  if(u.dead) return;
  u.hp -= dmg; u.hit = 0.12;
  if(u.hp<=0){
    u.dead = true;
    const mul = by.auto && by===G.e ? G.diff.mul : 1;
    const gold = Math.round(u.def.cost*1.2*mul), xp = Math.round(u.def.cost*mul);
    by.gold += gold; by.xp += xp;
    const own = opp(by); own.xp += Math.round(u.def.cost*0.25);
    if(by===G.p) addText(u.x, GY-u.def.h-14, "+"+gold, "#f5c542");
    for(let i=0;i<8;i++) G.parts.push({x:u.x, y:GY-u.def.h/2, vx:(Math.random()-0.5)*120, vy:-Math.random()*150, life:0.6, c:"#7f1d1d", r:3});
  }
}
function damageBase(s, dmg){
  if(G.over) return;
  s.hp -= dmg;
  if(s.hp<=0){ s.hp=0; endGame(s!==G.p); }
}
function explode(x, y, splash, dmg, by){
  const o = opp(by);
  for(const u of o.units) if(!u.dead && Math.abs(u.x-x) <= splash + u.def.w/2) damageUnit(u, dmg, by);
  if(Math.abs(o.front - x) <= splash) damageBase(o, dmg*0.5);
  for(let i=0;i<10;i++) G.parts.push({x, y:Math.min(y,GY-4), vx:(Math.random()-0.5)*200, vy:-Math.random()*200, life:0.5, c:i%2?"#f97316":"#fde047", r:4});
}
function fire(from, target, def, side, x, y){
  const tx = target.base ? side===G.p ? EB : PB : target.x;
  const ty = target.base ? GY-60 : GY - target.def.h*0.6;
  const dist = Math.hypot(tx-x, ty-y);
  const speed = {stone:420, arrow:520, bolt:600, bullet:1100, flame:300, shell:500, rock:380, fire:420, laser:4000}[def.proj] || 500;
  G.proj.push({x, y, sx:x, sy:y, tx, ty, target, t:0, dur:Math.max(0.05, dist/speed), dmg:def.dmg, splash:def.splash||0, side, kind:def.proj,
    arc: ["stone","rock","shell","fire"].includes(def.proj) ? Math.min(140, dist*0.25) : 0, init:true});
}
function step(dt){
  G.t += dt;
  for(const s of [G.p, G.e]){
    s.gold += income(s.era)*dt*(s===G.e?G.diff.mul:1);
    s.specialCd = Math.max(0, s.specialCd-dt);
    // production
    if(s.queue.length){
      const d = s.queue[0];
      const spawnX = s.front + s.dir*(d.w/2+4);
      const blocked = s.units.some(u => Math.abs(u.x - spawnX) < (u.def.w+d.w)/2 + 2);
      if(s.prodT < d.time) s.prodT += dt;
      if(s.prodT >= d.time && !blocked){
        s.units.push({id:++G.uid, def:d, x:spawnX, hp:d.hp, cdT:0.3, walk:Math.random()*5, atk:0, hit:0, dead:false});
        s.queue.shift(); s.prodT = 0;
      }
    }
  }
  for(const s of [G.p, G.e]){
    const o = opp(s), dir = s.dir;
    s.units.sort((a,b)=> (b.x-a.x)*dir);
    o.units.sort((a,b)=> (b.x-a.x)*o.dir);
    const ef = frontOf(o.units);
    for(let i=0;i<s.units.length;i++){
      const u = s.units[i], d = u.def; if(u.dead) continue;
      const ahead = i>0 ? s.units[i-1] : null;
      const gapE = ef ? (ef.x-u.x)*dir - (ef.def.w+d.w)/2 : Infinity;
      const gapB = (o.front - u.x)*dir - d.w/2;
      let target = null;
      if(ef && gapE <= d.range) target = ef;
      else if(gapB <= d.range) target = {base:true};
      const gapA = ahead ? (ahead.x-u.x)*dir - (ahead.def.w+d.w)/2 : Infinity;
      const blocked = target || gapA < 4 || gapE <= 1 || gapB <= 1;
      if(!blocked){ u.x += dir*d.speed*dt; u.walk += dt; }
      u.cdT -= dt; u.atk = Math.max(0,u.atk-dt); u.hit = Math.max(0,u.hit-dt);
      if(target && u.cdT<=0){
        u.cdT = d.cd; u.atk = 0.25;
        if(d.proj){ fire(u, target, d, s, u.x + dir*d.w/2, GY - d.h*0.7); }
        else if(target.base) damageBase(o, d.dmg);
        else damageUnit(target, d.dmg, s);
      }
    }
    // tourelles
    for(let i=0;i<4;i++){
      const t = s.turrets[i]; if(!t) continue;
      t.cdT -= dt;
      const p = turretPos(s,i);
      let best=null, bd=Infinity;
      for(const u of o.units){ if(u.dead) continue; const dd = Math.abs(u.x-p.x); if(dd<=t.def.range && dd<bd){bd=dd;best=u;} }
      if(best){
        t.ang = Math.atan2((GY-best.def.h/2)-p.y, Math.abs(best.x-p.x));
        if(t.cdT<=0){ t.cdT=t.def.cd; fire(t, best, t.def, s, p.x + s.dir*18, p.y-8); }
      }
    }
  }
  // projectiles
  for(const pr of G.proj){
    if(!pr.init){ pr.sx=pr.x; pr.sy=pr.y; pr.init=true; }
    pr.t += dt/pr.dur;
    if(pr.target && !pr.target.base && !pr.target.dead){ pr.tx = pr.target.x; pr.ty = GY - pr.target.def.h*0.6; }
    const k = Math.min(1, pr.t);
    pr.px = pr.x; pr.py = pr.y;
    pr.x = pr.sx + (pr.tx-pr.sx)*k;
    pr.y = pr.sy + (pr.ty-pr.sy)*k - (pr.arc||0)*4*k*(1-k);
    if(pr.t>=1){
      pr.done = true;
      if(pr.splash>0) explode(pr.tx, pr.ty, pr.splash, pr.dmg, pr.side);
      else if(pr.target && pr.target.base) damageBase(opp(pr.side), pr.dmg);
      else if(pr.target && !pr.target.dead) damageUnit(pr.target, pr.dmg, pr.side);
    }
  }
  G.proj = G.proj.filter(p=>!p.done);
  for(const s of [G.p,G.e]) s.units = s.units.filter(u=>!u.dead);

function ai(s){

  const threat = o.units.filter(u => Math.abs(u.x - s.front) < 900).length;
  if(s.specialCd<=0 && (threat>=5 || (threat>=2 && s.hp < s.maxHp*0.5))) useSpecial(s);

  for(let i=0;i<s.slots;i++){ const t=s.turrets[i]; if(t && t.def.era < s.era && s.gold > TD(s.era,t.def.k).cost*2.5){ sellTurret(s,i); buyTurret(s,Math.min(3,t.def.k+1)); } }

    for(let k=3;k>=0;k--){ const c=TD(s.era,k).cost; if(s.gold >= c*1.4 && Math.random()<0.5){ buyTurret(s,k); break; } }
  } else if(!free && s.slots<4 && s.gold > SLOT_COST[s.slots]*1.6) buySlot(s);

  const pressure = o.units.length - s.units.length;
  if(s.queue.length < (pressure>2?4:2)){
    const r = Math.random();
    let k = r<0.4?0 : r<0.72?1 : r<0.9?2 : 3;
    while(k>0 && s.gold < UD(s.era,k).cost) k--;

  }
}

  if(k==="laser"){ ctx.strokeStyle="#22d3ee"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.lineTo(p.x,p.y); ctx.stroke(); return; }
  if(k==="arrow"||k==="bolt"){
    const a = Math.atan2(p.y-(p.py??p.y), p.x-(p.px??p.x));
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(a); ctx.strokeStyle="#3f2a14"; ctx.lineWidth=k==="bolt"?2:1.5; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(4,0); ctx.stroke(); ctx.restore(); return;
  }
  if(k==="bullet"){ ctx.strokeStyle="#fde047"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo((p.px??p.x), (p.py??p.y)); ctx.stroke(); return; }
  if(k==="flame"||k==="fire"){ ctx.fillStyle = Math.random()<0.5?"#f97316":"#fde047"; ctx.beginPath(); ctx.arc(p.x,p.y,5+Math.random()*3,0,7); ctx.fill(); return; }
  ctx.fillStyle = k==="shell" ? "#1f2937" : "#57534e";
  ctx.beginPath(); ctx.arc(p.x,p.y, k==="rock"?6:k==="shell"?4:3,0,7); ctx.fill();
}
function drawBaseBar(s){
  const x = s.id===0 ? 30 : W-170, y = GY-355, w = 140;
  ctx.fillStyle="#000a"; ctx.fillRect(x,y,w,10);
  ctx.fillStyle=s.team; ctx.fillRect(x,y,w*s.hp/s.maxHp,10);
  ctx.fillStyle="#fff"; ctx.font="bold 11px sans-serif"; ctx.textAlign="center";
  ctx.fillText(Math.ceil(s.hp)+" / "+s.maxHp, x+w/2, y-4);
  ctx.fillText(ERAS[s.era].name, x+w/2, y+24);
}
function render(){
  clampCam();
  ctx.setTransform(scale,0,0,scale,-G.cam*scale,0);
  drawBg();
  drawBase(G.p); drawBase(G.e);
  for(const s of [G.p,G.e]) for(const u of s.units) if(u.x>G.cam-80 && u.x<G.cam+viewW+80) drawUnit(u,s);
  for(const p of G.proj) drawProj(p);
  for(const p of G.parts){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle=p.c; ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r); }
  ctx.globalAlpha=1;
  drawBaseBar(G.p); drawBaseBar(G.e);
  ctx.font="bold 13px sans-serif"; ctx.textAlign="center";
  for(const t of G.texts){ ctx.globalAlpha=Math.min(1,t.life); ctx.fillStyle="#000"; ctx.fillText(t.s,t.x+1,t.y+1); ctx.fillStyle=t.c; ctx.fillText(t.s,t.x,t.y); }
  ctx.globalAlpha=1;
  // minimap
  const mw=mini.width, mh=mini.height, k=mw/W;
  mctx.clearRect(0,0,mw,mh);
  mctx.fillStyle="#3b82f6"; mctx.fillRect(0,0,PB*k,mh);
  mctx.fillStyle="#ef4444"; mctx.fillRect(EB*k,0,mw-EB*k,mh);
  for(const s of [G.p,G.e]){ mctx.fillStyle=s.id===0?"#93c5fd":"#fca5a5"; for(const u of s.units) mctx.fillRect(u.x*k-1, mh*0.3, 2.5, mh*0.4); }
  mctx.strokeStyle="#fff"; mctx.lineWidth=1.5; mctx.strokeRect(G.cam*k, 1, viewW*k, mh-2);
}
function addText(x,y,s,c){ G.texts.push({x,y,s,c,life:1.2}); }

// ================= HUD =================
const $ = id => document.getElementById(id);
let msgT = 0;
function flash(s){ const m=$("msg"); m.textContent=s; m.style.opacity=1; clearTimeout(msgT); msgT=setTimeout(()=>m.style.opacity=0, 2200); }
function buildButtons(){
  const e = G.p.era;
  const ug = $("units"); ug.querySelectorAll("button").forEach(b=>b.remove());
  for(let k=0;k<4;k++){
    const d = UD(e,k), b = document.createElement("button");
    b.className="card"; b.id="u"+k;
    const kind = d.range>10 ? "distance" : "corps à corps";
    b.innerHTML = `<b>${k+1}. ${d.name}</b><span class="c">● ${d.cost}</span><small>${d.time} s · ${kind}</small><small class="d">PV ${d.hp} · Dég ${d.dmg}</small>`;
    b.title = `${d.name}\nCoût : ${d.cost}\nProduction : ${d.time} s\nPV : ${d.hp}\nDégâts : ${d.dmg}${d.splash?" (zone)":""}\nPortée : ${d.range>10?d.range:"mêlée"}`;
    b.onclick = ()=>{ if(!queueUnit(G.p,k)) flash(G.p.queue.length>=5?"File de production pleine (5 max)":"Pas assez d'or"); };
    ug.appendChild(b);
  }
  const tg = $("turrets"); tg.querySelectorAll("button").forEach(b=>b.remove());
  for(let k=0;k<4;k++){
    const d = TD(e,k), b = document.createElement("button");
    b.className="card"; b.id="t"+k;
    b.innerHTML = `<b>${d.name}</b><span class="c">● ${d.cost}</span><small class="d">Dég ${d.dmg}${d.splash?" zone":""} · Portée ${d.range}</small>`;
    b.title = `${d.name}\nCoût : ${d.cost}\nDégâts : ${d.dmg}${d.splash?" (zone)":""}\nCadence : ${d.cd}s\nPortée : ${d.range}`;
    b.onclick = ()=>{ if(G.p.gold<d.cost) return flash("Pas assez d'or"); buyTurret(G.p,k); };
    tg.appendChild(b);
  }
  $("spName").textContent = ERAS[e].special;
}
let lastHud = 0;
function refreshHud(force){
  const p = G.p;
  $("gold").textContent = Math.floor(p.gold);
  $("xp").textContent = Math.floor(p.xp) + (p.era<7 ? " / "+XP_REQ[p.era] : "");
  const lo = p.era? XP_REQ[p.era-1] : 0, hi = XP_REQ[p.era] ?? lo;
  $("xpbar").firstElementChild.style.width = p.era<7 ? Math.min(100,(p.xp-lo)/(hi-lo)*100)+"%" : "100%";
  $("eraName").textContent = (p.era+1)+"/8 · "+ERAS[p.era].name;
  $("evolve").disabled = !canEvolve(p);
  $("evolve").textContent = p.era<7 ? "Évoluer → "+ERAS[p.era+1].name : "Époque finale";
  $("special").disabled = p.specialCd>0;
  $("special").querySelector(".cd").style.width = (100 - p.specialCd/SPECIAL_CD*100)+"%";
  for(let k=0;k<4;k++){
    const ub=$("u"+k), tb=$("t"+k); if(!ub) continue;
    ub.disabled = !canQueue(p,k);
    tb.disabled = p.gold < TD(p.era,k).cost;
  }
  $("slot").disabled = p.slots>=4 || p.gold<SLOT_COST[p.slots];
  $("slotCost").textContent = p.slots>=4 ? "max (4)" : "● "+SLOT_COST[p.slots]+"  ("+p.slots+"/4)";
  $("sell").classList.toggle("on", G.sellMode);
  // file
  const q = $("queue"); let h = "";
  for(let i=0;i<5;i++){
    const d = p.queue[i];
    const pr = i===0 && d ? Math.min(100, p.prodT/d.time*100) : 0;
    h += `<div class="qi" title="${d?d.name:""}">${d? d.k+1 : ""}${i===0&&d?`<div class="p" style="width:${pr}%"></div>`:""}</div>`;
  }
  q.innerHTML = h;
}

// ================= ENTRÉES =================
const keys = {};
window.addEventListener("keydown", e=>{
  keys[e.key.toLowerCase()] = true;
  if(!G || G.over) return;
  if(["1","2","3","4"].includes(e.key)) queueUnit(G.p, +e.key-1);
  if(e.key===" "){ e.preventDefault(); togglePause(); }
  if(e.key.toLowerCase()==="e") evolve(G.p);
  if(e.key.toLowerCase()==="s") useSpecial(G.p);
});
window.addEventListener("keyup", e=>keys[e.key.toLowerCase()]=false);
let drag = null;
cv.addEventListener("pointerdown", e=>{ drag = {x:e.clientX, cam:G.cam, moved:false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>4) drag.moved=true; G.cam = drag.cam - dx*DPR/scale; });
cv.addEventListener("pointerup", e=>{
  if(drag && !drag.moved && G.sellMode){
    const r = cv.getBoundingClientRect();
    const wx = (e.clientX-r.left)*DPR/scale + G.cam, wy = (e.clientY-r.top)*DPR/scale;
    for(let i=0;i<G.p.slots;i++){ const p=turretPos(G.p,i); if(G.p.turrets[i] && Math.abs(wx-p.x)<22 && Math.abs(wy-p.y)<20){ sellTurret(G.p,i); G.sellMode=false; break; } }
  }
  drag=null;
});
cv.addEventListener("wheel", e=>{ G.cam += (e.deltaX||e.deltaY)*0.8; e.preventDefault(); }, {passive:false});
mini.addEventListener("pointerdown", e=>{ const r=mini.getBoundingClientRect(); G.cam = (e.clientX-r.left)/r.width*W - viewW/2; });
$("evolve").onclick = ()=>evolve(G.p);
$("special").onclick = ()=>useSpecial(G.p);
$("slot").onclick = ()=>buySlot(G.p);
$("sell").onclick = ()=>{ G.sellMode=!G.sellMode; if(G.sellMode){ flash("Clique sur une de tes tourelles pour la vendre"); G.cam=0; } };
$("speed").onclick = ()=>{ G.speed = G.speed===1?2:G.speed===2?3:1; $("speed").textContent="x"+G.speed; };
$("pause").onclick = togglePause;
function togglePause(){ G.paused=!G.paused; $("pause").textContent=G.paused?"▶":"❚❚"; }

// ================= BOUCLE =================
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if(G){
    if(keys["arrowleft"]||keys["q"]||keys["a"]) G.cam -= 700*dt;
    if(keys["arrowright"]||keys["d"]) G.cam += 700*dt;
    if(!G.paused && !G.over){ const n=G.speed; for(let i=0;i<n;i++) step(dt); }
    render();
    if(now-lastHud>100){ refreshHud(); lastHud=now; }
  }
  requestAnimationFrame(loop);
}
function showOverlay(html){ $("ovbox").innerHTML=html; $("overlay").style.display="grid"; }
function startMenu(){
  showOverlay(`<h1>Fronts du Temps</h1>
  <p>Défends ta base et détruis celle de l'adversaire en traversant 8 époques, de la Préhistoire à l'ère moderne.</p>
  <ul>
    <li><b>Or</b> : produis des unités (4 types) et achète des tourelles (4 types, jusqu'à 4 emplacements).</li>
    <li><b>XP</b> : gagnée en tuant des ennemis — elle débloque l'<b>évolution</b> vers l'époque suivante.</li>
    <li><b>Attaque spéciale</b> : une pluie dévastatrice toutes les ${SPECIAL_CD} s.</li>
    <li>Production : 2 s (mêlée), 3 s (distance), 6 s → 9 s à l'époque 7, 12 s → 20 s à partir de l'époque 5.</li>
    <li>Raccourcis : <b>1-4</b> unités · <b>E</b> évoluer · <b>S</b> spécial · <b>←/→</b> ou glisser pour défiler · <b>Espace</b> pause.</li>
  </ul>
  <div class="row"><button onclick="go('facile')">Facile</button><button onclick="go('normal')">Normal</button><button onclick="go('difficile')">Difficile</button></div>`);
}
function go(d){ $("overlay").style.display="none"; newGame(d); resize(); G.cam=0; last=performance.now(); }
resize(); startMenu(); requestAnimationFrame(loop);
</script>
</body>
