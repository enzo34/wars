name: APK Android

on:
  push:
    paths: ["www/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Clé de signature stable : secrets du dépôt si présents, sinon clé générée une fois et gardée en cache
      - name: Récupérer la clé de signature
        uses: actions/cache@v4
        with:
          path: ~/.fdt-signing
          key: fdt-signing-key-v1

      - name: Préparer la clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.fdt-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.fdt-signing/release.keystore
            printf '%s' "$KS_PASS" > ~/.fdt-signing/pass
          elif [ ! -f ~/.fdt-signing/release.keystore ]; then
            openssl rand -hex 24 > ~/.fdt-signing/pass
            keytool -genkeypair -keystore ~/.fdt-signing/release.keystore -alias fdt -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass "$(cat ~/.fdt-signing/pass)" -keypass "$(cat ~/.fdt-signing/pass)" -dname "CN=Fronts du Temps"
          fi
          echo "SIGN_STORE_FILE=$HOME/.fdt-signing/release.keystore" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=fdt" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat ~/.fdt-signing/pass)"
          echo "SIGN_STORE_PASSWORD=$(cat ~/.fdt-signing/pass)" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FrontsDuTemps.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrontsDuTemps-apk
          path: FrontsDuTemps.apk

      - name: Publier une Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fronts du Temps v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK Android de Fronts du Temps (branche `${{ github.ref_name }}`).
            Sur ton téléphone : télécharge **FrontsDuTemps.apk** ci-dessous, ouvre-le et autorise l'installation depuis cette source.
          files: FrontsDuTemps.apk
